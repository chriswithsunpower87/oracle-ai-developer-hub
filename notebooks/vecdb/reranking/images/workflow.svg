<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 1400 500"><title id="title">In-database reranking workflow</title><desc id="desc">The notebook host starts a Linux x86_64 conversion container. The container downloads a model from Hugging Face and converts it to ONNX. The ONNX model is uploaded to OCI Object Storage and exposed with a temporary PAR URL. Oracle AI Database loads the model and reranks documents.</desc><rect width="1400" height="500" fill="#fff"/><text x="700" y="38" fill="#172b4d" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">In-database reranking model pipeline</text><text x="700" y="66" fill="#52606d" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">From Hugging Face model to live VecDB reranking</text><defs><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="9" refY="5.5"><path fill="#52606d" d="M 0 0 L 11 5.5 L 0 11 z"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="285" height="295" x="30" y="105" fill="#eaf2ff" stroke="#7aa7d9" stroke-width="2" rx="20"/><circle cx="70" cy="145" r="21" fill="#3973b9"/><text x="70" y="152" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text><text x="108" y="152" fill="#172b4d" font-size="21" font-weight="700">Notebook host</text><line x1="55" x2="290" y1="180" y2="180" stroke="#b8d0eb" stroke-width="2"/><text x="55" y="220" fill="#172b4d" font-size="17" font-weight="700">Prepare and coordinate</text><text x="55" y="258" fill="#334e68" font-size="16">.env + Jupyter + Python</text><text x="55" y="292" fill="#334e68" font-size="16">Docker / Podman</text><text x="55" y="326" fill="#334e68" font-size="16">OCI CLI</text><rect width="285" height="295" x="355" y="105" fill="#f2ecff" stroke="#a995d6" stroke-width="2" rx="20"/><circle cx="395" cy="145" r="21" fill="#7655b8"/><text x="395" y="152" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">2</text><text x="425" y="152" fill="#172b4d" font-size="19" font-weight="700">Conversion container</text><line x1="380" x2="615" y1="180" y2="180" stroke="#cfc3ee" stroke-width="2"/><text x="380" y="220" fill="#172b4d" font-size="17" font-weight="700">Download and convert</text><text x="380" y="258" fill="#334e68" font-size="16">Linux x86_64</text><text x="380" y="292" fill="#334e68" font-size="16">Python 3.13 + OML4Py</text><text x="380" y="326" fill="#334e68" font-size="16">Hugging Face → ONNX</text><rect width="285" height="295" x="680" y="105" fill="#fff4e5" stroke="#d8ad6b" stroke-width="2" rx="20"/><circle cx="720" cy="145" r="21" fill="#bd7b16"/><text x="720" y="152" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">3</text><text x="758" y="152" fill="#172b4d" font-size="21" font-weight="700">OCI Object Storage</text><line x1="705" x2="940" y1="180" y2="180" stroke="#ecd3a8" stroke-width="2"/><text x="705" y="220" fill="#172b4d" font-size="17" font-weight="700">Publish the artifact</text><text x="705" y="258" fill="#334e68" font-size="16">Upload ONNX model</text><text x="705" y="292" fill="#334e68" font-size="16">Create temporary PAR</text><text x="705" y="326" fill="#334e68" font-size="16">Return PAR URL</text><rect width="365" height="295" x="1005" y="105" fill="#eaf7ef" stroke="#75b98e" stroke-width="2" rx="20"/><circle cx="1045" cy="145" r="21" fill="#2e8b57"/><text x="1045" y="152" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">4</text><text x="1083" y="152" fill="#172b4d" font-size="21" font-weight="700">Oracle AI Database</text><line x1="1030" x2="1345" y1="180" y2="180" stroke="#b8dfc4" stroke-width="2"/><text x="1030" y="220" fill="#172b4d" font-size="17" font-weight="700">Load and use the model</text><text x="1030" y="258" fill="#334e68" font-size="16">Load model from PAR URL</text><text x="1030" y="292" fill="#334e68" font-size="16">Run in-database reranking</text><text x="1030" y="326" fill="#334e68" font-size="16">Return relevance scores</text><line x1="320" x2="345" y1="255" y2="255" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/><line x1="645" x2="670" y1="255" y2="255" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/><line x1="970" x2="995" y1="255" y2="255" stroke="#52606d" stroke-width="3" marker-end="url(#arrow)"/></g></svg>