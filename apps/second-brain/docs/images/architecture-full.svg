<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 1040 780"><style>.box{stroke-width:1.5}.h,.h2,.title{font-weight:700;fill:#1a2b3c}.title{font-size:17px}.h{font-size:14px}.h2{font-size:12.5px}.s{font-size:12px}.s,.s2{fill:#4a5a6b}.lbl,.s2{font-size:11px}.lbl{fill:#7a8794}.arrow,.loop{stroke:#9aa7b4;stroke-width:2;fill:none;marker-end:url(#a)}.loop{stroke:#7fbf97;marker-end:url(#g);stroke-dasharray:5 4}</style><defs><marker id="a" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="4"><path fill="#9aa7b4" d="M0,0 L8,4 L0,8 z"/></marker><marker id="g" markerHeight="9" markerWidth="9" orient="auto" refX="7" refY="4"><path fill="#7fbf97" d="M0,0 L8,4 L0,8 z"/></marker></defs><rect width="1040" height="780" fill="#fff"/><text x="32" y="40" class="title">Second Brain on Oracle AI Database 26ai — full architecture</text><text x="32" y="60" class="lbl">your sources → one database (content · wiki · memory) → a research agent + an MCP server — self-improving, private, and reachable anywhere</text><text x="32" y="88" class="h">1 · YOUR SOURCES — you choose, and swap freely</text><g><rect width="104" height="38" x="32" y="98" fill="#eef4fb" stroke="#bcd3ec" class="box" rx="9"/><text x="84" y="122" class="s" text-anchor="middle">Notion</text><rect width="104" height="38" x="148" y="98" fill="#eef4fb" stroke="#bcd3ec" class="box" rx="9"/><text x="200" y="122" class="s" text-anchor="middle">YouTube</text><rect width="104" height="38" x="264" y="98" fill="#eef4fb" stroke="#bcd3ec" class="box" rx="9"/><text x="316" y="122" class="s" text-anchor="middle">Instagram</text><rect width="104" height="38" x="380" y="98" fill="#eef4fb" stroke="#bcd3ec" class="box" rx="9"/><text x="432" y="122" class="s" text-anchor="middle">AI chats</text><rect width="104" height="38" x="496" y="98" fill="#eef4fb" stroke="#bcd3ec" class="box" rx="9"/><text x="548" y="122" class="s" text-anchor="middle">LinkedIn</text><rect width="104" height="38" x="612" y="98" fill="#eef4fb" stroke="#bcd3ec" class="box" rx="9"/><text x="664" y="122" class="s" text-anchor="middle">…your own</text></g><path d="M374,136 L374,150" class="arrow"/><rect width="684" height="50" x="32" y="150" fill="#f4f7fa" stroke="#cdd8e3" class="box" rx="10"/><text x="46" y="171" class="h2">2 · Loaders (scripts/) → the one contract</text><text x="46" y="190" class="s2">normalize → posts(title · text · url · date) · redact secrets · classify visibility · embed in-DB (MiniLM) — no external embedding API</text><path d="M374,200 L374,216" class="arrow"/><rect width="684" height="292" x="32" y="216" fill="#f7fafd" stroke="#9aa7b4" stroke-width="2" rx="14"/><text x="46" y="242" class="h">3 · ONE Oracle AI Database 26ai</text><text x="46" y="260" class="lbl">relational + JSON Relational Duality + AI Vector Search — one engine, no glue</text><rect width="212" height="150" x="46" y="272" fill="#fff" stroke="#cdd8e3" class="box" rx="10"/><text x="152" y="295" class="h2" text-anchor="middle">Content</text><text x="152" y="317" class="s2" text-anchor="middle">posts + content_chunks</text><text x="152" y="337" class="s2" text-anchor="middle">Duality view: post_dv</text><text x="152" y="357" class="s2" text-anchor="middle">vectors: MiniLM (in-DB)</text><text x="152" y="377" class="s2" text-anchor="middle">series · visibility scope</text><text x="152" y="404" class="lbl" text-anchor="middle">everything you make</text><rect width="212" height="150" x="266" y="272" fill="#fff" stroke="#cdd8e3" class="box" rx="10"/><text x="372" y="295" class="h2" text-anchor="middle">Compiled Wiki</text><text x="372" y="317" class="s2" text-anchor="middle">wiki_pages (doc + vector)</text><text x="372" y="337" class="s2" text-anchor="middle">page_links (graph)</text><text x="372" y="357" class="s2" text-anchor="middle">page_sources (citations)</text><text x="372" y="377" class="s2" text-anchor="middle">Duality: wiki_page_dv</text><text x="372" y="404" class="lbl" text-anchor="middle">synthesized · grows itself</text><rect width="216" height="150" x="486" y="272" fill="#fff" stroke="#cdd8e3" class="box" rx="10"/><text x="594" y="295" class="h2" text-anchor="middle">Agent memory — 4 types</text><text x="594" y="317" class="s2" text-anchor="middle">episodic · semantic</text><text x="594" y="337" class="s2" text-anchor="middle">conversational</text><text x="594" y="357" class="s2" text-anchor="middle">procedural</text><text x="594" y="377" class="s2" text-anchor="middle">consolidated by the LLM</text><text x="594" y="404" class="lbl" text-anchor="middle">what the agent learns</text><rect width="326" height="58" x="46" y="436" fill="#eef4fb" stroke="#bcd3ec" class="box" rx="9"/><text x="60" y="457" class="h2">Hybrid retrieval</text><text x="60" y="476" class="s2">semantic vectors + keyword, fused (RRF)</text><text x="60" y="490" class="lbl">across wiki · item · passage, ranked together</text><rect width="316" height="58" x="386" y="436" fill="#fbeeee" stroke="#e3bcbc" class="box" rx="9"/><text x="400" y="457" class="h2">🔒 Privacy scope</text><text x="400" y="476" class="s2">only visibility=&apos;content&apos; is ever read</text><text x="400" y="490" class="lbl">searched · compiled into the wiki · consolidated</text><path d="M702,330 L740,330" class="arrow"/><rect width="268" height="180" x="740" y="228" fill="#eaf7ef" stroke="#b7e0c6" class="box" rx="12"/><text x="874" y="254" class="h" text-anchor="middle">4 · Research agent (Claude)</text><text x="874" y="278" class="s2" text-anchor="middle">tools: search · get_post ·</text><text x="874" y="296" class="s2" text-anchor="middle">get_wiki_page · live web</text><text x="874" y="320" class="s2" text-anchor="middle">grounded — cites your work</text><text x="874" y="342" class="s2" text-anchor="middle">recalls + records memory</text><text x="874" y="366" class="s2" text-anchor="middle">auto-consolidates over time</text><text x="874" y="392" class="lbl" text-anchor="middle">retrieves knowledge + memory together</text><rect width="268" height="84" x="740" y="424" fill="#eef7f0" stroke="#b7e0c6" class="box" rx="12"/><text x="756" y="447" class="h2">↻ Self-improving sync (daily)</text><text x="756" y="467" class="s2">pull → classify (safety net) →</text><text x="756" y="485" class="s2">refresh + GROW wiki → consolidate</text><path d="M740,466 C716,466 710,466 702,466" class="loop"/><path d="M874,424 L874,410" class="loop"/><path d="M374,508 L374,524" class="arrow"/><rect width="684" height="92" x="32" y="524" fill="#fbf6ee" stroke="#e7d6b8" class="box" rx="12"/><text x="46" y="550" class="h">5 · MCP server — your brain as a tool for any AI client</text><text x="46" y="573" class="s2">read: search · fetch · wiki · topics · recent · by_series · overview · write: ingest_note (gated)</text><text x="46" y="597" class="lbl">local (stdio) + hosted (HTTP · OAuth allowlist · fail-closed · rate-limited · MCP_READONLY) · injection-guarded</text><path d="M374,616 L374,632" class="arrow"/><g><rect width="220" height="42" x="32" y="632" fill="#f0f2f4" stroke="#cdd8e3" class="box" rx="9"/><text x="142" y="658" class="s" text-anchor="middle">Claude — desktop · web · phone</text><rect width="200" height="42" x="264" y="632" fill="#f0f2f4" stroke="#cdd8e3" class="box" rx="9"/><text x="364" y="658" class="s" text-anchor="middle">ChatGPT</text><rect width="240" height="42" x="476" y="632" fill="#f0f2f4" stroke="#cdd8e3" class="box" rx="9"/><text x="596" y="658" class="s" text-anchor="middle">your apps · Claude Code</text></g><rect width="268" height="150" x="740" y="524" fill="#f4f2fb" stroke="#d6cfe8" class="box" rx="12"/><text x="756" y="548" class="h2">Pluggable by design</text><text x="756" y="570" class="s2">LLM: Claude (default) — or OpenAI /</text><text x="756" y="588" class="s2">local open-source (e.g. Ollama)</text><text x="756" y="612" class="s2">Embeddings: open-source MiniLM, in-DB</text><text x="756" y="630" class="s2">— search needs no API key</text><text x="756" y="654" class="s2">Deploy: local Docker ⇄ Oracle</text><text x="756" y="672" class="s2">Autonomous (cloud, optional)</text><text x="32" y="708" class="lbl">The database is the constant; the LLM is pluggable. Content, its meaning (vectors), the synthesized wiki, and the agent&apos;s memory all live in one Oracle 26ai engine.</text></svg>