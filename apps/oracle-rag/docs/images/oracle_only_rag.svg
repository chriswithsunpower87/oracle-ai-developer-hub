" y="240" fill="#1e3a5f" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="1000" y="285" fill="#e5e5e5" font-size="20" font-weight="600" text-anchor="middle">Local LLM</text><text x="1000" y="310" fill="#a0a0a0" font-size="16" text-anchor="middle">(Ollama)</text><text x="600" y="510" fill="#a0a0a0" font-size="20" text-anchor="middle">1 database. 0 external API calls. Everything in one place.</text><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a0a0a0" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs></svg>