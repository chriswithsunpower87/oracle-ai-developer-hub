<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" viewBox="0 0 1200 600"><rect width="1200" height="600" x="0" y="0" fill="#1e1e2e"/><text x="600" y="60" fill="#e5e5e5" font-size="32" font-weight="700" text-anchor="middle">Typical Multi-Service RAG Stack</text><rect width="180" height="100" x="60" y="220" fill="#1e3a5f" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="150" y="278" fill="#e5e5e5" font-size="22" font-weight="600" text-anchor="middle">Documents</text><line x1="240" x2="320" y1="270" y2="270" stroke="#a0a0a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect width="200" height="100" x="320" y="220" fill="#5c1a1a" stroke="#ef4444" stroke-width="2" rx="10"/><text x="420" y="270" fill="#e5e5e5" font-size="20" font-weight="600" text-anchor="middle">OpenAI Embeddings</text><text x="420" y="298" fill="#ef4444" font-size="15" text-anchor="middle">costs $ per call</text><line x1="520" x2="600" y1="270" y2="270" stroke="#a0a0a0" stroke-width="2.5" marker-end="url(#arrow)"/><rect width="200" height="100" x="600" y="220" fill="#5c1a1a" stroke="#ef4444" stroke-width="2" rx="10"/><text x="700" y="270" fill="#e5e5e5" font-size="22" font-weight="600" text-anchor="middle">Pinecone</text><text x="700" y="298" fill="#ef4444" font-size="15" text-anchor="middle">vector database, $</text><rect width="200" height="100" x="600" y="380" fill="#5c3d1a" stroke="#f59e0b" stroke-width="2" rx="10"/><text x="700" y="430" fill="#e5e5e5" font-size="22" font-weight="600" text-anchor="middle">Postgres</text><text x="700" y="458" fill="#f59e0b" font-size="15" text-anchor="middle">text and metadata</text><line x1="700" x2="700" y1="320" y2="380" stroke="#f59e0b" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrowOrange)" marker-start="url(#arrowOrangeStart)"/><text x="722" y="358" fill="#f59e0b" font-size="14">sync</text><line x1="800" x2="880" y1="270" y2="270" stroke="#a0a0a0" stroke-width="2.5" marker-end="url