="translate(9, 41)"><g class="terminal-1876176149-matrix"><text x="0" y="20" class="terminal-1876176149-r1" clip-path="url(#terminal-1876176149-line-0)" textLength="1390.8">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="0" y="44.4" class="terminal-1876176149-r3" clip-path="url(#terminal-1876176149-line-1)" textLength="256.2">Agent Reasoning TUI</text><text x="890.6" y="44.4" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-1)" textLength="85.4">Model:</text><text x="976" y="44.4" class="terminal-1876176149-r5" clip-path="url(#terminal-1876176149-line-1)" textLength="158.6">gemma3:latest</text><text x="1134.6" y="44.4" class="terminal-1876176149-r6" clip-path="url(#terminal-1876176149-line-1)" textLength="158.6">● Connected</text><text x="0" y="68.8" class="terminal-1876176149-r1" clip-path="url(#terminal-1876176149-line-2)" textLength="1390.8">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="24.4" y="117.6" class="terminal-1876176149-r3" clip-path="url(#terminal-1876176149-line-4)" textLength="73.2">AGENTS</text><text x="305" y="117.6" class="terminal-1876176149-r3" clip-path="url(#terminal-1876176149-line-4)" textLength="268.4">[cot] Chain of Thought</text><text x="24.4" y="142" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-5)" textLength="219.6">──────────────────</text><text x="305" y="142" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-5)" textLength="829.6">────────────────────────────────────────────────────────────────────</text><text x="24.4" y="166.4" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-6)" textLength="122">○ Standard</text><text x="24.4" y="190.8" class="terminal-1876176149-r3" clip-path="url(#terminal-1876176149-line-7)" textLength="61">● CoT</text><text x="305" y="190.8" class="terminal-1876176149-r7" clip-path="url(#terminal-1876176149-line-7)" textLength="61">You:</text><text x="366" y="190.8" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-7)" textLength="536.8">Explain quantum entanglement in simple terms</text><text x="24.4" y="215.2" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-8)" textLength="61">○ ToT</text><text x="24.4" y="239.6" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-9)" textLength="85.4">○ ReAct</text><text x="305" y="239.6" class="terminal-1876176149-r3" clip-path="url(#terminal-1876176149-line-9)" textLength="122">Assistant:</text><text x="24.4" y="264" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-10)" textLength="134.2">○ Recursive</text><text x="305" y="264" class="terminal-1876176149-r6" clip-path="url(#terminal-1876176149-line-10)" textLength="97.6">Step 1:</text><text x="402.6" y="264" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-10)" textLength="341.6">Let&apos;s start with the basics.</text><text x="24.4" y="288.4" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-11)" textLength="146.4">○ Reflection</text><text x="305" y="288.4" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-11)" textLength="683.2">Quantum entanglement is a phenomenon where two particles</text><text x="24.4" y="312.8" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-12)" textLength="158.6">○ Consistency</text><text x="305" y="312.8" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-12)" textLength="622.2">become connected so that the state of one instantly</text><text x="24.4" y="337.2" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-13)" textLength="146.4">○ Decomposed</text><text x="305" y="337.2" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-13)" textLength="549">influences the other, regardless of distance.</text><text x="24.4" y="361.6" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-14)" textLength="146.4">○ Least→Most</text><text x="24.4" y="386" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-15)" textLength="146.4">○ Refinement</text><text x="305" y="386" class="terminal-1876176149-r6" clip-path="url(#terminal-1876176149-line-15)" textLength="97.6">Step 2:</text><text x="402.6" y="386" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-15)" textLength="463.6">Think of it like a pair of magic dice.</text><text x="24.4" y="410.4" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-16)" textLength="122">○ Pipeline</text><text x="305" y="410.4" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-16)" textLength="585.6">When you roll one die and get a 6, the other die</text><text x="24.4" y="434.8" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-17)" textLength="97.6">○ Debate</text><text x="305" y="434.8" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-17)" textLength="634.4">instantly shows 1, no matter how far apart they are.</text><text x="24.4" y="459.2" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-18)" textLength="73.2">○ MCTS</text><text x="24.4" y="483.6" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-19)" textLength="146.4">○ Analogical</text><text x="305" y="483.6" class="terminal-1876176149-r6" clip-path="url(#terminal-1876176149-line-19)" textLength="97.6">Step 3:</text><text x="402.6" y="483.6" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-19)" textLength="475.8">The key insight is that this connection</text><text x="24.4" y="508" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-20)" textLength="122">○ Socratic</text><text x="305" y="508" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-20)" textLength="585.6">happens faster than light, which Einstein called</text><text x="24.4" y="532.4" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-21)" textLength="73.2">○ Meta</text><text x="305" y="532.4" class="terminal-1876176149-r8" clip-path="url(#terminal-1876176149-line-21)" textLength="366">&quot;spooky action at a distance.&quot;</text><text x="24.4" y="556.8" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-22)" textLength="219.6">──────────────────</text><text x="24.4" y="581.2" class="terminal-1876176149-r5" clip-path="url(#terminal-1876176149-line-23)" textLength="158.6">⚔ Arena Mode</text><text x="305" y="581.2" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-23)" textLength="610">Therefore, quantum entanglement is nature&apos;s way of</text><text x="24.4" y="605.6" class="terminal-1876176149-r5" clip-path="url(#terminal-1876176149-line-24)" textLength="183">⚔ Head-to-Head</text><text x="305" y="605.6" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-24)" textLength="597.8">linking particles so they share a fate, no matter</text><text x="24.4" y="630" class="terminal-1876176149-r9" clip-path="url(#terminal-1876176149-line-25)" textLength="122">🔬 Debugger</text><text x="305" y="630" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-25)" textLength="414.8">where they end up in the universe.</text><text x="24.4" y="654.4" class="terminal-1876176149-r10" clip-path="url(#terminal-1876176149-line-26)" textLength="146.4">📊 Benchmarks</text><text x="24.4" y="678.8" class="terminal-1876176149-r10" clip-path="url(#terminal-1876176149-line-27)" textLength="122">📁 Sessions</text><text x="24.4" y="703.2" class="terminal-1876176149-r10" clip-path="url(#terminal-1876176149-line-28)" textLength="158.6">📖 Agent Guide</text><text x="24.4" y="727.6" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-29)" textLength="219.6">──────────────────</text><text x="24.4" y="752" class="terminal-1876176149-r1" clip-path="url(#terminal-1876176149-line-30)" textLength="183">⚙ Select Model</text><text x="0" y="825.2" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-33)" textLength="1390.8">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="0" y="849.6" class="terminal-1876176149-r11" clip-path="url(#terminal-1876176149-line-34)" textLength="158.6">TTFT: 312ms</text><text x="158.6" y="849.6" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-34)" textLength="195.2">│ Tokens: 142</text><text x="353.8" y="849.6" class="terminal-1876176149-r11" clip-path="url(#terminal-1876176149-line-34)" textLength="170.8">│ TPS: 38.4</text><text x="524.6" y="849.6" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-34)" textLength="183">│ Time: 3.7s</text><text x="0" y="874" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-35)" textLength="1390.8">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="0" y="898.4" class="terminal-1876176149-r3" clip-path="url(#terminal-1876176149-line-36)" textLength="48.8">&gt;</text><text x="48.8" y="898.4" class="terminal-1876176149-r2" clip-path="url(#terminal-1876176149-line-36)" textLength="12.2">█</text><text x="0" y="922.8" class="terminal-1876176149-r4" clip-path="url(#terminal-1876176149-line-37)" textLength="1390.8">──────────────────────────────────────────────────────────────────────────────────────────────────────────────────</text></g></g></svg>