" textLength="97.6">Step 2:</text><text x="134.2" y="264" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-10)" textLength="219.6">The most efficient</text><text x="695.4" y="264" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-10)" textLength="12.2">│</text><text x="732" y="264" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-10)" textLength="341.6">Merge sort divides the array</text><text x="1378.6" y="264" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-10)" textLength="12.2">│</text><text x="0" y="288.4" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-11)" textLength="12.2">│</text><text x="36.6" y="288.4" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-11)" textLength="353.8">general-purpose sort is merge</text><text x="695.4" y="288.4" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-11)" textLength="12.2">│</text><text x="732" y="288.4" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-11)" textLength="353.8">recursively and merges sorted</text><text x="1378.6" y="288.4" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-11)" textLength="12.2">│</text><text x="0" y="312.8" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-12)" textLength="12.2">│</text><text x="36.6" y="312.8" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-12)" textLength="317.2">sort with O(n log n) time.</text><text x="695.4" y="312.8" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-12)" textLength="12.2">│</text><text x="732" y="312.8" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-12)" textLength="390.4">halves, guaranteeing O(n log n).</text><text x="1378.6" y="312.8" class="terminal-230675153-r1" clip-path="url(#terminal-230675153-line-12)" textLength="12.2">│</text><text x="0" y="337.2" class="terminal-230675153